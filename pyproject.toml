[tool.black]
line-length = 100
[tool.pyright]
extraPaths = ["."]

[tool.pyrefly]
search_path = ["."]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short --cov=src --cov-report=term-missing"
testpaths = [
    "tests"
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
